<!--
  A11yFred icon, 512×512.
  viewBox is 540×540 (padding around the icon so the drop shadow can't clip).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7A6BEC"/>
      <stop offset="55%" stop-color="#5445D6"/>
      <stop offset="100%" stop-color="#3D2FB3"/>
    </linearGradient>
    <linearGradient id="topShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="85%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>

    <!--
      Inset shadow filter, makes the A look recessed/carved into the surface.
      - dy = 5.12 (1% of 512) for the downward offset, scales proportionally at any export size.
      - feMorphology erode by 2.5 to shrink the alpha, producing shadow on ALL sides
        (not just the top), giving a recessed-around-the-edges look.
      - 66% black opacity for a clearly visible but not harsh feel.
    -->
    <filter id="innerShadowHard" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="erode" radius="2.5" result="eroded"/>
      <feOffset in="eroded" dx="0" dy="5.12" result="offsetEroded"/>
      <feComposite in="SourceAlpha" in2="offsetEroded" operator="out" result="cutoutShadow"/>
      <feFlood flood-color="#000000" flood-opacity="0.66" result="black"/>
      <feComposite in="black" in2="cutoutShadow" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="shadow"/>
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="squircle">
      <rect x="14" y="10" width="512" height="512" rx="112" ry="112"/>
    </clipPath>

    <!-- The A as a reusable symbol in plain SVG units (no scale transform on the filtered element). -->
    <symbol id="letterA" viewBox="0 0 698.5 706" preserveAspectRatio="xMidYMid meet">
      <!-- Outfit Bold A path, with X shifted by -15 so the glyph bbox starts at origin, and Y flipped via outer group -->
      <g transform="translate(-15, 706) scale(1, -1)">
        <path fill="#FFFFFF" fill-rule="nonzero"
              d="M15 0 294.5 706H436.5L713.5 0H547.5L336 586H393L178 0ZM174 127.5V255.5H558.5V127.5Z"/>
      </g>
    </symbol>
  </defs>

  <!-- Drop shadow ground -->
  <g filter="url(#dropShadow)">
    <rect x="14" y="10" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  </g>

  <!-- Main body, clipped to the squircle -->
  <g clip-path="url(#squircle)">
    <rect x="14" y="10" width="512" height="512" fill="url(#bg)"/>
    <rect x="14" y="10" width="512" height="512" fill="url(#topShine)"/>
    <rect x="14" y="10" width="512" height="512" fill="url(#bottomGlow)"/>

    <!--
      Place the A as a <use> of the symbol, with filter applied here so the offset is in SVG units.
      A occupies 326.5×330 SVG units (0.4674 × glyph dimensions), centered in the icon.
      Icon center is (270, 266). A position: x = 270 - 326.5/2 = 106.75, y = 266 - 330/2 = 101.
      Slight optical drop: y = 105.
    -->
    <use href="#letterA" x="106.75" y="105" width="326.5" height="330" filter="url(#innerShadowHard)"/>
  </g>

  <!-- Crisp inner border for definition at small sizes -->
  <rect x="14.5" y="10.5" width="511" height="511" rx="111.5" ry="111.5" fill="none" stroke="#2A1E8A" stroke-opacity="0.35" stroke-width="1"/>
</svg>
