<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    .fg { stroke: #5548c8; fill: #5548c8; }
    @media (prefers-color-scheme: dark) {
      .fg { stroke: #ffffff; fill: #ffffff; }
    }
  </style>
  <!-- Magnifying glass body -->
  <circle cx="13" cy="13" r="8.5" class="fg" stroke-width="3"/>
  <!-- Handle -->
  <line x1="19.5" y1="19.5" x2="28" y2="28" class="fg" stroke-width="3" stroke-linecap="round"/>
  <!-- A letterform inside glass -->
  <text x="13" y="17.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" class="fg">A</text>
</svg>
