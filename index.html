<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A11yTextHelper</title>

    <!--
      ══════════════════════════════════════════════════════════════
      SEO — ALL COMMENTED OUT (dev / Netlify preview deployment)
      Uncomment and fill in real URLs/values before Phase 3 launch.
      ══════════════════════════════════════════════════════════════

      ── Core meta ────────────────────────────────────────────────

    <meta name="description" content="A11yTextHelper — search, refine, and copy WCAG-aligned accessibility defect descriptions in seconds. Built for professional web and native app auditors." />
    <meta name="author" content="Mikey Ilagan" />
    <meta name="robots" content="index, follow" />

      ── Canonical ────────────────────────────────────────────────

    <link rel="canonical" href="https://yourdomain.com/" />

      ── Open Graph (Facebook, LinkedIn, Slack unfurls) ───────────

    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://yourdomain.com/" />
    <meta property="og:title"       content="A11yTextHelper — Accessibility defect descriptions, fast" />
    <meta property="og:description" content="Search a curated corpus of WCAG-aligned defect write-ups, refine them with AI, and copy them straight into your audit spreadsheet." />
    <meta property="og:image"       content="https://yourdomain.com/og-image.png" />
    <meta property="og:image:alt"   content="A11yTextHelper interface showing a defect search result" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale"      content="en_US" />
    <meta property="og:site_name"   content="A11yTextHelper" />

      ── Twitter / X Card ─────────────────────────────────────────

    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="A11yTextHelper — Accessibility defect descriptions, fast" />
    <meta name="twitter:description" content="Search a curated corpus of WCAG-aligned defect write-ups, refine them with AI, and copy them straight into your audit spreadsheet." />
    <meta name="twitter:image"       content="https://yourdomain.com/og-image.png" />
    <meta name="twitter:image:alt"   content="A11yTextHelper interface showing a defect search result" />

      ── Structured data (JSON-LD) — WebApplication ───────────────

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "A11yTextHelper",
      "url": "https://yourdomain.com/",
      "description": "Search, refine, and copy WCAG-aligned accessibility defect descriptions. Built for professional web and native app auditors.",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Mikey Ilagan"
      },
      "keywords": "accessibility, WCAG, a11y, defect descriptions, audit tool, screen reader, ARIA"
    }
    </script>

      ── Sitemap ──────────────────────────────────────────────────
      Generate public/sitemap.xml (single URL, this is a SPA) and add:

    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

      ══════════════════════════════════════════════════════════════
    -->

    <!-- Block crawlers on this dev deployment (see public/robots.txt) -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Browser chrome color on mobile. Updated dynamically by App.jsx for light/dark/party themes -->
    <meta name="theme-color" content="#5548c8" />

    <!-- Color scheme for Firefox and other browsers — enables theme-color support -->
    <meta name="color-scheme" content="light dark" />

    <!-- Set initial theme-color based on system preference before React loads -->
    <script>
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', isDark ? '#1a1a1a' : '#5548c8');
    </script>

    <!--
      Umami Analytics (privacy-first, no cookies, GDPR-compliant)
      1. Create a free account at https://umami.is or self-host
      2. Add your site, then replace YOUR_WEBSITE_ID below
      3. Uncomment the script tag

    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="YOUR_WEBSITE_ID"
    ></script>
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
