<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A11yHelper</title>

    <!-- Core SEO meta tags (fill in real domain before Phase 1 public release) -->
    <meta name="description" content="A11yHelper — search, refine, and copy WCAG-aligned accessibility defect descriptions in seconds. Built for professional web and native app auditors." />
    <meta name="author" content="Mikey Ilagan" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL (update to production domain) -->
    <link rel="canonical" href="https://a11yhelper.app/" />

    <!-- Open Graph (Facebook, LinkedIn, Slack unfurls) — placeholder image URL -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://a11yhelper.app/" />
    <meta property="og:title"       content="A11yHelper — Accessibility defect descriptions, fast" />
    <meta property="og:description" content="Search a curated corpus of WCAG-aligned defect write-ups, refine them with AI, and copy them straight into your audit spreadsheet." />
    <meta property="og:image"       content="https://a11yhelper.app/og-image.png" />
    <meta property="og:image:alt"   content="A11yHelper interface showing a defect search result" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale"      content="en_US" />
    <meta property="og:site_name"   content="A11yHelper" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="A11yHelper — Accessibility defect descriptions, fast" />
    <meta name="twitter:description" content="Search a curated corpus of WCAG-aligned defect write-ups, refine them with AI, and copy them straight into your audit spreadsheet." />
    <meta name="twitter:image"       content="https://a11yhelper.app/og-image.png" />
    <meta name="twitter:image:alt"   content="A11yHelper interface showing a defect search result" />

    <!-- Structured data (JSON-LD) — WebApplication schema for rich results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "A11yHelper",
      "url": "https://a11yhelper.app/",
      "description": "Search, refine, and copy WCAG-aligned accessibility defect descriptions. Built for professional web and native app auditors.",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Mikey Ilagan"
      },
      "keywords": "accessibility, WCAG, a11y, defect descriptions, audit tool, screen reader, ARIA"
    }
    </script>

    <!-- Sitemap reference (SPA single entry) -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Block crawlers on this dev deployment (see public/robots.txt) -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Color scheme preference for all browsers (Firefox, Safari, Chrome, Edge) -->
    <meta name="color-scheme" content="light dark" />

    <!--
      Umami Analytics (privacy-first, no cookies, GDPR-compliant)
      1. Create a free account at https://umami.is or self-host
      2. Add your site, then replace YOUR_WEBSITE_ID below
      3. Uncomment the script tag

    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="YOUR_WEBSITE_ID"
    ></script>
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
